[project]
name = "datacube-benchmark"
dynamic = ["version"]
description = "Utilities to benchmark datacubes with various formats, compressions, and chunking schemes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Max Jones", email = "14077947+maxrjones@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["zarr", "datacube", "benchmark", "xarray", "obstore", "geospatial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: System :: Benchmark",
]
dependencies = [
    # arro3-core is used indirectly via `obstore.list(return_arrow=True)`
    # in utils.py — obstore imports it lazily and errors without it.
    "arro3-core>=0.5.1",
    "dask>=2025.5.1",
    "numcodecs>=0.16.1",
    "numpy>=2.0",
    "obstore>=0.6.0",
    "pandas>=2.0",
    "pint>=0.24.4",
    "pyarrow>=20.0.0",
    "xarray>=2025.6.1",
    "zarr>=3.0.8",
]

[project.urls]
Homepage = "https://developmentseed.org/datacube-benchmark/"
Documentation = "https://developmentseed.org/datacube-benchmark/"
Repository = "https://github.com/developmentseed/datacube-benchmark"
Issues = "https://github.com/developmentseed/datacube-benchmark/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-material[imaging]>=9.6.3",
    "mkdocstrings>=0.27.0",
    "mkdocstrings-python>=1.13.0",
    "mypy>=1.15.0",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/datacube_benchmark/_version.py"

[tool.numpydoc_validation]
# See https://numpydoc.readthedocs.io/en/latest/validation.html#built-in-validation-checks for list of checks
checks = [
    "GL06",
    "GL07",
    # Currently broken; see https://github.com/numpy/numpydoc/issues/573
    # "GL09",
    "GL10",
    "SS02",
    "SS04",
    "PR02",
    "PR03",
    "PR05",
    "PR06",
]

[tool.mypy]
files = ["src/datacube_benchmark"]

[[tool.mypy.overrides]]
# Neither distributes type stubs / a py.typed marker.
module = ["pandas.*", "numcodecs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["datacube_benchmark"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
